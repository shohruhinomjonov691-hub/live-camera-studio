<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup review</title>
<link rel="icon" href="data:,">
<!-- Design-review tool only. Never ship this page or its controls in the app. -->
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #050608; color: #e8d9ad; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
.bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px; border-bottom: 1px dashed #5b4a1d; background: #17140a; }
.bar b { color: #ffd77a; letter-spacing: .04em; }
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
button { font: inherit; border: 1px solid #5b4a1d; background: transparent; color: #e8d9ad; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
button[aria-pressed="true"] { background: #ffd77a; color: #17140a; border-color: #ffd77a; }
.frame { display: flex; justify-content: center; padding: 16px; }
iframe { border: 1px solid #262c38; border-radius: 10px; background: #0b0d11; width: 100%; height: calc(100vh - 110px); }
.mobile iframe { width: 390px; height: 844px; }
</style>
</head>
<body>
<div class="bar">
  <b>MOCKUP REVIEW</b><span>Fake preview — no camera or detection.</span>
  <span class="group" data-key="state">State:
    <button data-v="idle">idle</button><button data-v="prompt">prompt</button><button data-v="loading">loading</button>
    <button data-v="live">live</button><button data-v="noface">no face</button><button data-v="snapshot">snapshot</button>
    <button data-v="denied">denied</button><button data-v="nocam">no camera</button><button data-v="error">error</button>
  </span>
  <span class="group" data-key="upload">Upload:
    <button data-v="">—</button><button data-v="empty">empty</button><button data-v="detecting">detecting</button>
    <button data-v="editor">editor</button><button data-v="draw">drawing</button><button data-v="error">error</button>
  </span>
  <span class="group" data-key="blur">Face blur: <button data-v="">on</button><button data-v="off">off</button></span>
  <span class="group" data-key="later">Batch tags: <button data-v="">show</button><button data-v="off">hide</button></span>
  <span class="group" data-key="lang">Lang: <button data-v="">saved</button><button data-v="en">EN</button><button data-v="ko">KO</button></span>
  <span class="group" data-key="size">Size: <button data-v="desktop">desktop</button><button data-v="mobile">390 px</button></span>
</div>
<div class="frame" id="frame"><iframe id="app" title="Live Camera Studio mockup"></iframe></div>
<script>
"use strict";
const opts = { state: "live", upload: "", blur: "", later: "", lang: "", size: "desktop" };
function update() {
  document.querySelectorAll(".group").forEach((g) =>
    g.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(opts[g.dataset.key] === b.dataset.v))));
  document.getElementById("frame").className = "frame " + opts.size;
  const p = new URLSearchParams();
  for (const k of ["state", "upload", "blur", "later", "lang"]) if (opts[k]) p.set(k, opts[k]);
  document.getElementById("app").src = "mockup.html#" + p.toString();
}
document.querySelectorAll(".group").forEach((g) =>
  g.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    opts[g.dataset.key] = e.target.dataset.v;
    update();
  }));
update();
</script>
</body>
</html>
