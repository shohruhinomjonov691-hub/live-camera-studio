# Smoke-test server: HTTP/1.1 on :80 and HTTPS + HTTP/2 on :443, same proxy snippet as production.
upstream live_camera_studio {
    server app:8000;
    keepalive 8;
}

server {
    listen 80;
    # Same syntax as the production site on Nginx 1.24 (http2 as a listen parameter), throwaway certificate.
    listen 443 ssl http2;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    error_log /var/log/nginx/error.log info;   # temp-file buffering is reported at "warn"

    include /etc/nginx/snippets/live-camera-studio-proxy.conf;

    # CONTROL ONLY (not in production): default-style buffering with small buffers. The check expects Nginx to
    # report temp files here — proving the check would notice if the production settings regressed.
    location /__control/ {
        rewrite ^/__control/(.*)$ /$1 break;
        client_body_buffer_size 16k;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 1024m;
        proxy_pass http://live_camera_studio;
    }
}
