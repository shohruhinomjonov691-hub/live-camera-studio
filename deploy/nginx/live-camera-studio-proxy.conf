# Live Camera Studio — proxy rules for the existing Nginx (include inside the app's server block).
# Used unchanged by deploy/smoke/, which checks that no image bytes touch the proxy's disk.
#
# Uploaded photos must never be written to disk, so request and response buffering to temporary files is off:
# - request bodies are streamed to the app as they arrive (no client_body_temp file);
# - if Nginx has to hold a body anyway, it stays in memory up to the app's 10 MB limit;
# - responses (blurred images) are streamed back and never spooled to proxy_temp.

client_max_body_size 11m;          # the app itself rejects anything over 10 MB with 413
client_body_buffer_size 11m;       # keep any held body in memory
client_body_in_file_only off;
proxy_request_buffering off;       # stream request bodies; no temp file
proxy_buffering off;               # stream responses; no proxy_temp file
proxy_max_temp_file_size 0;        # and never spool a response to disk even if buffering is turned back on
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# The app sets CSP, Permissions-Policy, nosniff, Referrer-Policy and Cache-Control: no-store for /api/.
# Do not add or override those headers here.

location / {
    proxy_pass http://live_camera_studio;
}

# Vendored MediaPipe files and models have versioned paths and can be cached by browsers.
location /static/vendor/ {
    proxy_pass http://live_camera_studio;
    expires 30d;
}
